<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeMade ERP — Sistem Manajemen Konveksi</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body style="text-align: center; align-content: center">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"
                stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                              repeatCount="indefinite"/>
        </circle>
    </svg>

    <script>
        window.GOOGLE_CLIENT_ID = "647282996110-mik622aj16qo935rcqqf84ecgs282om8.apps.googleusercontent.com";
        window.authenticatedGoogleEmail = "";
        window.authenticatedGoogleName = "";

        window.openGoogleLoginPopup = function() {
            if (window.google && window.google.accounts && window.google.accounts.oauth2) {
                const client = google.accounts.oauth2.initTokenClient({
                    client_id: window.GOOGLE_CLIENT_ID,
                    scope: 'email profile openid',
                    callback: function(tokenResponse) {
                        if (tokenResponse && tokenResponse.access_token) {
                            fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                                headers: { 'Authorization': 'Bearer ' + tokenResponse.access_token }
                            })
                            .then(function(res) { return res.json(); })
                            .then(function(profile) {
                                window.authenticatedGoogleEmail = profile.email || "";
                                window.authenticatedGoogleName = profile.name || profile.email || "";
                                if (window.onGoogleAuthCallback) {
                                    window.onGoogleAuthCallback(window.authenticatedGoogleEmail, window.authenticatedGoogleName);
                                }
                            })
                            .catch(function(err) {
                                alert("Gagal mengambil profil akun Google: " + err.message);
                            });
                        }
                    },
                    error_callback: function(err) {
                        console.warn("Google popup closed or canceled", err);
                    }
                });
                client.requestAccessToken();
            } else {
                // Fallback: Redirect langsung ke endpoint OAuth Google
                const redirectUri = window.location.origin + window.location.pathname;
                const authUrl = "https://accounts.google.com/o/oauth2/v2/auth?" +
                    "client_id=" + encodeURIComponent(window.GOOGLE_CLIENT_ID) +
                    "&response_type=token" +
                    "&redirect_uri=" + encodeURIComponent(redirectUri) +
                    "&scope=openid%20email%20profile" +
                    "&nonce=" + Date.now();
                window.location.href = authUrl;
            }
        };

        // Check if returning from redirect with #access_token=...
        if (window.location.hash && window.location.hash.indexOf('access_token=') !== -1) {
            var hash = window.location.hash.substring(1);
            var params = new URLSearchParams(hash);
            var accessToken = params.get('access_token');
            if (accessToken) {
                fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                    headers: { 'Authorization': 'Bearer ' + accessToken }
                })
                .then(function(res) { return res.json(); })
                .then(function(profile) {
                    window.authenticatedGoogleEmail = profile.email || "";
                    window.authenticatedGoogleName = profile.name || profile.email || "";
                    window.history.replaceState(null, null, window.location.pathname);
                    if (window.onGoogleAuthCallback) {
                        window.onGoogleAuthCallback(window.authenticatedGoogleEmail, window.authenticatedGoogleName);
                    }
                });
            }
        }
    </script>
    <script type="application/javascript" src="webApp.js"></script>
</body>
</html>
