<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeMade ERP — Sistem Manajemen Konveksi</title>
    <link type="text/css" rel="stylesheet" href="/styles.css">
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div id="app-loader" style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #f8fafc; z-index: 99999; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 50 50" role="presentation">
            <circle cx="25" cy="25" r="20" stroke="#e2e8f0" stroke-width="4" fill="none"/>
            <circle cx="25" cy="25" r="20" stroke="#2563eb" stroke-width="4" fill="none" stroke-linecap="round"
                    stroke-dasharray="90 125">
                <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                                  repeatCount="indefinite"/>
            </circle>
        </svg>
        <p style="margin-top: 16px; font-size: 14px; font-weight: 600; color: #475569;">Memuat WeMade ERP...</p>
    </div>

    <script>
        window.hideAppLoader = function() {
            var loader = document.getElementById('app-loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.transition = 'opacity 0.25s ease-out';
                setTimeout(function() {
                    if (loader.parentNode) {
                        loader.parentNode.removeChild(loader);
                    }
                }, 250);
            }
        };
        window.GOOGLE_CLIENT_ID = "647282996110-mik622aj16qo935rcqqf84ecgs282om8.apps.googleusercontent.com";

        // The app exchanges a Google ID TOKEN (a signed JWT) for a WeMade session, and the
        // server verifies that token against Google. The previous flow used an OAuth
        // access_token and read the profile in the browser, which meant the identity was
        // asserted client-side and could not be verified by the backend at all.
        function deliverGoogleIdToken(idToken) {
            if (!idToken) { return; }
            if (window.onGoogleAuthCallback) {
                window.onGoogleAuthCallback(idToken);
            }
        }

        function googleIdTokenRedirect() {
            // Fallback when One Tap cannot be shown (third-party cookies blocked, cooldown,
            // unsupported browser). Uses the implicit id_token flow.
            var redirectUri = window.location.origin + window.location.pathname;
            var nonce = String(Date.now()) + "-" + Math.random().toString(36).slice(2);
            try { window.sessionStorage.setItem("google_nonce", nonce); } catch (e) {}

            window.location.href = "https://accounts.google.com/o/oauth2/v2/auth?" +
                "client_id=" + encodeURIComponent(window.GOOGLE_CLIENT_ID) +
                "&response_type=id_token" +
                "&redirect_uri=" + encodeURIComponent(redirectUri) +
                "&scope=" + encodeURIComponent("openid email profile") +
                "&nonce=" + encodeURIComponent(nonce);
        }

        var googleIdInitialized = false;
        function initGoogleIdentity() {
            if (googleIdInitialized) { return true; }
            if (!(window.google && window.google.accounts && window.google.accounts.id)) {
                return false;
            }
            window.google.accounts.id.initialize({
                client_id: window.GOOGLE_CLIENT_ID,
                callback: function(response) {
                    // response.credential is the ID token.
                    deliverGoogleIdToken(response && response.credential);
                },
                auto_select: false,
                cancel_on_tap_outside: true
            });
            googleIdInitialized = true;
            return true;
        }

        window.openGoogleLoginPopup = function() {
            if (!initGoogleIdentity()) {
                googleIdTokenRedirect();
                return;
            }

            try {
                window.google.accounts.id.prompt(function(notification) {
                    var notDisplayed = notification &&
                        typeof notification.isNotDisplayed === "function" &&
                        notification.isNotDisplayed();
                    var skipped = notification &&
                        typeof notification.isSkippedMoment === "function" &&
                        notification.isSkippedMoment();
                    if (notDisplayed || skipped) {
                        googleIdTokenRedirect();
                    }
                });
            } catch (err) {
                googleIdTokenRedirect();
            }
        };

        // Returning from the redirect fallback with #id_token=...
        if (window.location.hash && window.location.hash.indexOf("id_token=") !== -1) {
            var params = new URLSearchParams(window.location.hash.substring(1));
            var returnedIdToken = params.get("id_token");
            if (returnedIdToken) {
                window.history.replaceState(null, null, window.location.pathname);
                // The Compose app registers its callback during start-up, so hold the token
                // until it is ready rather than dropping it.
                window.pendingGoogleIdToken = returnedIdToken;
                var deliverWhenReady = function() {
                    if (window.onGoogleAuthCallback) {
                        var pending = window.pendingGoogleIdToken;
                        window.pendingGoogleIdToken = null;
                        deliverGoogleIdToken(pending);
                    } else {
                        window.setTimeout(deliverWhenReady, 100);
                    }
                };
                deliverWhenReady();
            }
        }
    </script>
    <script type="application/javascript" src="/webApp.js"></script>
</body>
</html>
