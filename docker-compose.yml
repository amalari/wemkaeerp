services:
  postgres:
    image: postgres:18-alpine
    container_name: wemade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-wemade_erp}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - wemade_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-wemade_erp}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Object storage S3-compatible untuk berkas PO yang di-upload (Deal → Purchase Order).
  # Server membacanya lewat env: S3_ENDPOINT/S3_ACCESS_KEY/S3_SECRET_KEY/S3_BUCKET_PO.
  minio:
    image: minio/minio:latest
    container_name: wemade-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-wemademinio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-wemademinio-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - wemade_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: buat bucket PO bila belum ada.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY:-wemademinio} $${S3_SECRET_KEY:-wemademinio-secret} &&
      mc mb --ignore-existing local/${S3_BUCKET_PO:-wemade-po}
      "

volumes:
  wemade_pgdata:
    name: wemade_pgdata
  wemade_miniodata:
    name: wemade_miniodata
